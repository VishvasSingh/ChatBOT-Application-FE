<p-card header="Welcome to the Dashboard">
  <p>Here you can manage your projects and view recent activity.</p>
  <button
    pButton
    type="button"
    label="Create New Project"
    class="home__button w-full mt-3">
  </button>

</p-card>


<p-card header="Active Projects">
  <p-table [value]="projects" [loading]="loading">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Date of Creation</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-project>
      <tr>
        <td>{{ project.name }}</td>
        <td>{{ project.status }}</td>
        <td>
          <button
            pButton
            type="button"
            label="View"
            class="p-button-outlined p-button-info"
          ></button>
      </tr>
    </ng-template>
  </p-table>
</p-card>
